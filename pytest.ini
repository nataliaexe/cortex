[pytest]
# Configuração do pytest para o projeto Cortex
# Permite que pytest funcione sem PYTHONPATH=.

testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de descoberta
addopts =
    -v
    --tb=short
    --strict-markers

# Marcadores personalizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    api: Testes de API
    database: Testes de banco de dados
    security: Testes de segurança