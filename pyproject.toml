[project]
name = "cortex"
version = "0.1.0"
description = "Assistente pessoal hibrido, governado e offline-first"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "ollama>=0.3",
    "sqlite-vec>=0.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
voice = [
    "vosk>=0.3.45",
    "piper-tts>=1.2",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "webrtcvad>=2.0.10",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cortex = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex*", "cli*", "server*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
