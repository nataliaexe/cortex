  patterns:
    - "sldt"
  remediation: "Requer privilégios de kernel"

assembly_str:
  type: privilege_escalation
  severity: high
  description: "str lê task register"
  patterns:
    - "str"
  remediation: "Requer privilégios de kernel"

assembly_smsw:
  type: privilege_escalation
  severity: high
  description: "smsw lê machine status word"
  patterns:
    - "smsw"
  remediation: "Requer privilégios de kernel"

assembly_invlpg:
  type: cache_manipulation
  severity: medium
  description: "invlpg invalida TLB entry"
  patterns:
    - "invlpg"
  remediation: "Pode ser usado em cache attacks"

assembly_wbinvd:
  type: cache_manipulation
  severity: medium
  description: "wbinvd write-back e invalida cache"
  patterns:
    - "wbinvd"
  remediation: "Requer privilégios de kernel"

assembly_rsm:
  type: privilege_escalation
  severity: high
  description: "rsm retorna do SMM"
  patterns:
    - "rsm"
  remediation: "Requer privilégios de kernel"

assembly_rdmsr:
  type: privilege_escalation
  severity: high
