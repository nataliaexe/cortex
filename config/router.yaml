    code_generation: qwen/qwen3.8-27b
    code_refactor: qwen/qwen3.8-27b
    long_reasoning: qwen/qwen3.8-27b
    planning: qwen/qwen3.8-27b

# Privacidade
privacy:
  never_send_patterns:
    - "/etc/shadow"
    - "id_rsa"
    - "id_ed25519"
    - ".kdbx"
    - ".p12"
    - ".pfx"
  never_send_regex:
    - "sk-[A-Za-z0-9]{20,}"
    - "sk-or-v1-[A-Za-z0-9]{20,}"
    - "gsk_[A-Za-z0-9]{20,}"
    - "AQ\\.[A-Za-z0-9_-]{30,}"
    - "AIza[A-Za-z0-9_-]{30,}"
    - "xox[baprs]-[A-Za-z0-9-]{10,}"
    - "ghp_[A-Za-z0-9]{30,}"
    - "AKIA[A-Z0-9]{16}"
    - "(?m)^[A-Z][A-Z0-9_]{2,}\\s*=\\s*[A-Za-z0-9_\\-]{20,}$"
    - "(?i)password\\s*[:=]\\s*\\S+"
    - "(?i)secret\\s*[:=]\\s*[A-Za-z0-9_\\-]{16,}"
