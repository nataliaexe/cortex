      - deepseek-chat
      - deepseek-reasoner
    timeout_seconds: 120
    free: false
    cost_input_per_mtok: 0.27
    cost_output_per_mtok: 1.10

  openai:
    enabled: false
    kind: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    models:
      - gpt-4o-mini
      - gpt-4o
    timeout_seconds: 120
    free: false
    cost_input_per_mtok: 2.50
    cost_output_per_mtok: 10.00

memory:
  working_window_messages: 20
  episodic_retention_days: 365
  semantic_min_score: 0.35

governance:
  default_action: deny
  dry_run_required:
    - files.write
    - files.delete
    - shell.run
    - system.shutdown
    - system.reboot

tools:
  files:
    allowed_roots:
      - /home/nana/cortex
      - /home/nana/projetos
      - /home/nana/Documentos
      - /tmp/cortex-sandbox
    max_read_bytes: 2000000
  shell:
    allowlist_argv0:
      - ls
      - cat
      - grep
      - rg
      - fd
      - find
      - git
      - curl
      - wget
      - nmap
      - python
      - python3
      - pip
      - pytest
      - ruff
    forbid_shell_meta: true
    timeout_seconds: 60
